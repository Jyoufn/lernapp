  <div class="app" id="app">
    <!-- ===================== Sidebar ===================== -->
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="sidebar-inner">
        <!-- oben: Workspace (vorerst nur Anzeige), Suche -->
        <div class="sb-head">
          <button type="button" class="sb-ws" title="Workspace"><span class="sb-ws-name">Julian</span><svg class="sb-ws-chev" width="14" height="14"><use href="#o-chev"/></svg></button>
          <button type="button" class="sb-head-btn" id="sbSearch" aria-label="Chats durchsuchen" title="Chats durchsuchen"><svg width="16" height="16"><use href="#o-search"/></svg></button>
          <button type="button" class="sb-head-btn" id="sbSettings" aria-label="Einstellungen" title="Einstellungen"><svg width="16" height="16"><use href="#o-gear"/></svg></button>
        </div>
        <nav class="nav sb-main" aria-label="Hauptnavigation">
          <a class="nav-item" href="#" data-nav="new"><svg width="16" height="16"><use href="#o-plus"/></svg>Neuer Chat</a>
          <a class="nav-item" href="#" data-nav="history"><svg width="16" height="16"><use href="#o-chat"/></svg>Chatverlauf</a>
          <a class="nav-item" href="#" data-nav="docs"><svg width="16" height="16"><use href="#o-library"/></svg>Bibliothek</a>
          <a class="nav-item" href="#" data-nav="tasks"><svg width="16" height="16"><use href="#o-tasks"/></svg>Aufgaben</a>
          <a class="nav-item" href="#" data-nav="calendar"><svg width="16" height="16"><use href="#o-calendar"/></svg>Kalender</a>
        </nav>
        <!-- darunter scrollt: Chats und Dokumente (einklappbar), Lesezeichen – per JavaScript -->
        <div class="sb-scroll" id="sbScroll">
          <nav class="nav sb-chats sb-sec" id="sbChats" data-sec="chats" aria-label="Letzte Chats"></nav>
        </div>
      </div>
    </aside>

    <!-- ===================== Hauptteil ===================== -->
    <main class="main">
      <!-- Tab-Leiste ausgeblendet (die Tabs arbeiten im Hintergrund weiter, gewechselt wird über die Sidebar) -->
      <header class="tabbar" hidden>
        <div class="tabs" id="tabs" role="tablist">
          <div class="tab active" role="tab" tabindex="0" aria-selected="true"><svg width="14" height="14" style="color:#e0533d"><use href="#i-agent"/></svg><span class="tab-title">Neuer Chat</span><button class="tab-close" type="button" aria-label="Tab schließen"><svg width="16" height="16"><use href="#i-x"/></svg></button></div>
          <button class="icon-btn" type="button" id="newTab" aria-label="Neuer Tab" title="Neuer Tab"><svg width="16" height="16"><use href="#i-plus"/></svg></button>
        </div>
      </header>

      <!-- Hauptteil als abgerundeter Kasten – die Tabs liegen außerhalb -->
      <div class="panel">
      <!-- immer oben links im Hauptteil: Sidebar ein-/ausklappen -->
      <button class="sb-head-btn panel-toggle" id="sidebarToggle" type="button" aria-label="Sidebar ein-/ausklappen" aria-controls="sidebar" aria-expanded="true" title="Sidebar ein-/ausklappen (Strg+B / ⌘B)"><svg width="16" height="16"><use href="#i-sidebar"/></svg></button>
      <!-- Chat oben links (Titel + Menü) und oben rechts (alle Chats) -->
      <div class="chat-bar" id="chatBar">
        <div class="chat-title-wrap">
          <button class="chat-title-btn" type="button" id="chatTitleBtn" aria-haspopup="menu" aria-expanded="false"><span class="chat-title" id="chatTitle">Neuer Chat</span><svg width="10" height="10"><use href="#f-chevron-down"/></svg></button>
          <div class="chat-pop chat-menu" id="chatMenu" role="menu">
            <button type="button" role="menuitem" data-cm="rename"><svg width="14" height="14"><use href="#f-pencil"/></svg><span>Umbenennen</span></button>
            <button type="button" role="menuitem" data-cm="pin"><svg width="14" height="14"><use href="#f-pin"/></svg><span>Anheften</span></button>
            <button type="button" role="menuitem" data-cm="copy"><svg width="14" height="14"><use href="#f-copy"/></svg><span>Als Text kopieren</span></button>
            <div class="cm-sep" role="separator"></div>
            <button type="button" role="menuitem" data-cm="delete" class="danger"><svg width="14" height="14"><use href="#f-trash"/></svg><span>Löschen</span></button>
          </div>
        </div>
        <div class="chats-wrap">
          <!-- oben rechts: Chat-Symbol → öffnet direkt den Chatverlauf -->
          <button class="icon-btn chats-btn" type="button" id="chatsBtn" aria-label="Chatverlauf" title="Chatverlauf" aria-haspopup="dialog" aria-expanded="false"><svg width="15" height="15"><use href="#f-chats"/></svg></button>
          <div class="chat-pop chats-pop" id="chatsPop" role="dialog" aria-label="Alle Chats">
            <div class="cp-list" id="cpList"></div>
          </div>
        </div>
      </div>
      <div class="top-stack" id="topStack">
      <div class="dock-ambient" id="dockAmbient" aria-hidden="true"></div>
      <div class="dock-search" id="dockSearch"></div>
      <div class="voice-agent" id="voiceAgent" role="region" aria-label="Agent" hidden>
        <div class="va-head">
          <button class="agent-face va-face" type="button" aria-label="Gespräch anzeigen" title="Gespräch anzeigen"></button><!-- Allgemein-Hund, eingesetzt von pixel-dogs.js -->
          <div class="va-text">
            <div class="va-title">Agent is on it <span class="va-level" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
            <div class="va-status" id="vaStatus" aria-live="polite">Mikro an</div>
          </div>
          <div class="va-actions">
          <button class="va-btn" type="button" id="vaMusic" aria-label="Player ein-/ausblenden" title="Player" aria-pressed="false" hidden><svg width="16" height="16"><use href="#i-music"/></svg></button>
          <button class="va-btn" type="button" id="vaMic" aria-label="Mikrofon stummschalten" title="Mikrofon stummschalten"><svg width="16" height="16"><use href="#i-mic"/></svg></button>
          <button class="va-btn" type="button" id="vaToggle" aria-label="Gespräch anzeigen" title="Gespräch anzeigen" aria-expanded="false"><svg width="16" height="16"><use href="#i-chevron-down"/></svg></button>
          <button class="va-btn" type="button" id="vaClose" aria-label="Agent beenden" title="Beenden"><svg width="16" height="16"><use href="#i-x"/></svg></button>
          </div>
        </div>
        <div class="va-panel">
          <div class="va-ask" id="vaAsk"></div>
        </div>
      </div>
      </div>
      <div class="content">
        <div class="chat-scroll" id="chatScroll">
          <!-- Nachrichten werden per JavaScript eingefügt -->
          <div class="chat" id="chat"></div>
        </div>
      </div>

      <!-- ===================== Eingabe ===================== -->
      <div class="composer-area">
        <form class="composer" id="composer" autocomplete="off">
          <!-- Modell-Auswahl -->
          <div class="model-popover" id="modelPopover" role="dialog" aria-label="Modell wählen">
            <div class="mp-list" id="modelList"></div>
            <div class="mp-sep"></div>
            <div class="mp-list" id="effortList" role="listbox" aria-label="Aufwand"></div>
          </div>

          <div class="attachments" id="attachments"></div>
          <textarea id="input" rows="1" placeholder="Work with Agent…" aria-label="Nachricht"></textarea>
          <div class="composer-bar">
            <button type="button" class="plus-btn" id="attachBtn" aria-label="Foto hinzufügen" title="Foto hinzufügen"><svg width="16" height="16"><use href="#i-plus"/></svg></button>
            <input type="file" id="fileInput" accept="image/*,application/pdf" multiple hidden />
            <button type="button" class="model-chip" id="modelChip" aria-haspopup="dialog" aria-expanded="false">
              <span id="chipModel">Opus 5.5</span>
              <span id="chipEffort">Extra High</span>
              <svg class="chip-chev" width="16" height="16"><use href="#i-chevron-down"/></svg>
            </button>

            <div class="flex-spacer"></div>

            <button type="button" class="mic-btn" id="micBtn" aria-label="Sprachaufnahme starten" title="Sprachaufnahme starten" aria-pressed="false">
              <svg class="icon-mic" width="16" height="16"><use href="#i-mic"/></svg>
              <svg class="icon-stop" width="16" height="16"><use href="#i-stop"/></svg>
            </button>
            <button type="button" class="voice-btn" id="voiceBtn" aria-label="Sprachmodus" title="Sprachmodus" aria-pressed="false"><svg width="16" height="16"><use href="#f-voice"/></svg></button>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Senden" title="Senden"><svg class="icon-send" width="16" height="16"><use href="#i-arrow-up"/></svg><svg class="icon-stop" width="16" height="16"><use href="#i-stop"/></svg></button>
          </div>
        </form>

        <!-- Listening – ploppt unter dem Feld auf -->
        <div class="status-row">
          <div class="listening" id="listening" role="status" aria-live="polite">
            <span class="dot"></span><span id="listeningText">Listening</span>
          </div>
        </div>      </div>
      </div>
    </main>
    <aside class="rpane" id="rpane" aria-label="Seitenfenster"></aside>
  </div>

  <!-- Bild-Großansicht -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Bildansicht">
    <div class="lb-backdrop" data-lb-close></div>
    <div class="lb-stage" id="lbStage" data-lb-close></div>
    <button class="lb-btn lb-close" type="button" aria-label="Schließen" data-lb-close><svg width="16" height="16"><use href="#i-x"/></svg></button>
    <button class="lb-btn lb-prev" type="button" id="lbPrev" aria-label="Vorheriges Bild"><svg width="16" height="16"><use href="#i-back"/></svg></button>
    <button class="lb-btn lb-next" type="button" id="lbNext" aria-label="Nächstes Bild"><svg width="16" height="16"><use href="#i-forward"/></svg></button>
    <div class="lb-count" id="lbCount"></div>
  </div>

  <!-- Markdown → HTML, Sicherheitsfilter, Formeln -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <!-- App-Skripte: lädt auth.js in dieser Reihenfolge – erst, wenn klar ist, ob man angemeldet ist (und die Kontodaten da sind) -->
  <template id="appScripts">
    <script src="icons.js"></script><!-- gefüllte Icons (#f-…), siehe README.md -->
    <script src="chat-visuals.js"></script>
    <script src="settings.js"></script><!-- Einstellungen; vor app.js: hängt die Schlüssel vom Gerät an /api-Anfragen -->
    <script src="app.js"></script>
    <script src="code-agent.js"></script><!-- Coding-Agent: Dateien, Code-Fenster, Vorschau -->
    <script src="pixel-dogs.js"></script><!-- Pixel-Hunde: Modus-Icons oben, Begleiter am Eingabefeld -->
    <script src="music.js"></script>
    <script src="timer.js"></script>
    <script src="ui-kit.js"></script>
    <script src="calendar.js"></script>
    <script src="tasks.js"></script>
    <script src="docblocks.js"></script><!-- Slash-Menü und Blöcke im Dokument -->
    <script src="docs.js"></script>
    <script src="inbox.js"></script>
  </template>
  <script src="auth.js?v=4"></script><!-- Anmeldung + Konto (Daten ins Konto), lädt danach die App -->
</body>
</html>
